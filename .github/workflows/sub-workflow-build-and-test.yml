name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref (commit SHA, branch, or tag) to checkout. Defaults to the triggering ref."
        required: false
        type: string
        default: ""
    outputs:
      artifact-id:
        description: "The ID of the uploaded artifact"
        value: ${{ jobs.build-and-test.outputs.artifact-id }}
      sha:
        description: "The short SHA of the commit"
        value: ${{ jobs.build-and-test.outputs.sha }}

permissions:
  contents: read

env:
  BUILD_ARTIFACT_NAME: build-artifact
  PROXY_ARTIFACT_NAME: proxy-artifact

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha: ${{ steps.short-sha.outputs.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha

      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Two puppeteer@24.40.0 instances exist (resolved against typescript 5.9
      # and 6.0). Each runs a postinstall that downloads the SAME Chrome into the
      # shared ~/.cache/puppeteer concurrently — the downloads race and leave a
      # corrupt browser dir (folder present, executable missing), which fails the
      # whole install. Skip the auto-download here; we install the browser once,
      # serially, in the next step.
      - run: pnpm install
        env:
          CI: true
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Single, serial browser install — no concurrent writers, so no race. The
      # rm -rf guarantees a clean target even if a partial dir was left behind.
      - name: Install Puppeteer browser
        run: |
          rm -rf ~/.cache/puppeteer
          pnpm --filter e2e exec puppeteer browsers install

      - run: pnpm -w build

      # - run: pnpm run lint
      #   continue-on-error: false

      - run: pnpm -w test

      # - run: pnpm run test:coverage
      #   continue-on-error: true

      - run: pnpm -w validate

      - name: Build with metadata
        run: |
          BUILD_INFO='window.cps_global_components_build = {Sha: "${{ steps.short-sha.outputs.sha }}", RunId: "${{ github.run_number }}", Timestamp: "${{ github.event.repository.updated_at }}"'
          if [ -n "${{ inputs.branch }}" ]; then
            BUILD_INFO="${BUILD_INFO}, Branch: \"${{ inputs.branch }}\""
          fi
          BUILD_INFO="${BUILD_INFO}};"
          pnpm --filter cps-global-components run rollup --intro "$BUILD_INFO"

      - run: |
          cp -r ./packages/cps-global-components/dist/global-components.js ./e2e/harness
          pnpm --filter e2e test

      - run: |
          rm -rf ./to-deploy
          mkdir -p ./to-deploy
          cp ./packages/cps-global-components/dist/global-components.js ./to-deploy
          cp ./packages/cps-global-components/dist/global-components.js.map ./to-deploy
          cp ./packages/cps-global-script-redirect/dist/cps-global-components.js ./to-deploy
          cp ./packages/cps-global-handover/auth-handover.html ./to-deploy
          cp ./packages/cps-global-handover/dist/auth-handover.js ./to-deploy
          cp ./packages/cps-global-handover/dist/auth-handover.js.map ./to-deploy
          cp ./packages/cps-global-components/src/services/diagnostics/probe-iframe-load.html ./to-deploy
          cp -r ./packages/cps-global-preview/dist ./to-deploy/preview
          cp -r ./packages/cps-global-accessibility/dist ./to-deploy/accessibility

      - uses: actions/upload-artifact@v6
        id: upload
        with:
          name: ${{env.BUILD_ARTIFACT_NAME}}
          path: |
            ./to-deploy/*
          retention-days: 1

      - uses: actions/upload-artifact@v6
        id: upload-proxy
        with:
          name: ${{env.PROXY_ARTIFACT_NAME}}
          path: |
            ./infra/proxy/dist/*
          retention-days: 1
