name: "Rollback: test (QA) to its previous release"

# Emergency exit for test (QA): restores the release it served before the last deploy, in seconds.
# No inputs by design (org policy, Checkov CKV_GHA_7). Run it again to undo.
# See .github/README.md, "Restore the Previous Release".
#
# To enrol another environment, copy this file with the environment changed, and add the
# environment to ROLLBACK_ENROLLED_ENVIRONMENTS in sub-workflow-deploy-script.yml so its deploys
# take the snapshot this restores.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    uses: ./.github/workflows/sub-workflow-restore-previous-release.yml
    with:
      environment: test
    secrets:
      BLOB_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}
