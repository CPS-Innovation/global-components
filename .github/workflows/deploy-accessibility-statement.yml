name: "Deploy: accessibility statement only (all environments including prod)"

# Publishes ONLY packages/cps-global-accessibility/statement.html to every
# environment's blob container at accessibility/statement.html. Use this to push
# a content update to the accessibility statement — including prod — WITHOUT
# shipping the rest of the latest main branch (no global-components.js, no
# config, no harness). statement.html is a static page with no build step (the
# vite build output is byte-identical to the source), so it is uploaded straight
# from the repo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch is main
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "Error: Production deployments can only be run from the main branch"
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi
          echo "Branch validation passed: running from main branch"

  publish-statement:
    needs: validate-branch
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ["accessibility", "dev", "test", "uat", "prod"]
    steps:
      - uses: actions/checkout@v6

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha

      - uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload \
              --container-name ${{ matrix.environment }} \
              --name accessibility/statement.html \
              --file ./packages/cps-global-accessibility/statement.html \
              --connection-string "${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}" \
              --content-type "text/html" \
              --content-cache-control "max-age=20, stale-while-revalidate=3600, stale-if-error=3600" \
              --overwrite true \
              --metadata statementonly=true buildsha=${{ steps.short-sha.outputs.sha }} buildrunid=${{ github.run_number }}
