name: "Internal: sub-workflow: restore an environment to its previous release"

# The emergency exit. Puts an environment back to EXACTLY the release it served before the last
# deploy — same bytes, same config — in seconds, with no rebuild. Every deploy to an enrolled
# environment first snapshots whatever is live (see ROLLBACK_ENROLLED_ENVIRONMENTS in
# sub-workflow-deploy-script.yml), and this copies that snapshot back. Mechanics and layout:
# .github/scripts/release-snapshots.sh.
#
# Called by one no-input dispatch workflow per enrolled environment (rollback-previous-release-*.yml).
# Inputs live here rather than on the dispatch workflows because org policy (Checkov CKV_GHA_7)
# requires workflow_dispatch inputs to be empty.
#
# Unlike rollback.yml this does NOT touch git: main is left as it is. So after a restore the
# environment is BEHIND main, and the next deploy of main re-ships whatever was rolled back from.
# The run summary says so.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      BLOB_STORAGE_CONNECTION_STRING:
        required: true

permissions:
  contents: read

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch is main
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "Error: Rollback can only be run from the main branch"
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi

  restore:
    needs: validate-branch
    runs-on: ubuntu-latest
    # One restore per environment at a time.
    concurrency:
      group: restore-previous-release-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.BLOB_STORAGE_CONNECTION_STRING }}
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Show what is live and what is held
        run: |
          LIVE=$(bash .github/scripts/release-snapshots.sh live "$ENVIRONMENT")
          {
            echo "## Before: \`$ENVIRONMENT\` is serving \`$LIVE\`"
            echo
            echo "| Last live | buildsha |"
            echo "| --- | --- |"
            bash .github/scripts/release-snapshots.sh list "$ENVIRONMENT" | awk '{ printf "| %s | `%s` |\n", $1, $2 }'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "LIVE_BEFORE=$LIVE" >> "$GITHUB_ENV"

      # Snapshots what is live first, and does not prune — so the release rolled away from stays
      # held until the next deploy, and running this again undoes it.
      - name: Restore previous release
        run: |
          RESTORED=$(bash .github/scripts/release-snapshots.sh restore "$ENVIRONMENT" previous)
          echo "RESTORED=$RESTORED" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          MAIN=$(git rev-parse HEAD)
          {
            echo "## After: \`$ENVIRONMENT\` is serving \`$RESTORED\` (was \`$LIVE_BEFORE\`)"
            echo
            echo "To undo, run this workflow again: it puts back \`$LIVE_BEFORE\`, which is held until the next deploy."
            echo
            # buildsha is a short sha, so compare as a prefix of main's full sha.
            if [[ "$MAIN" != "$RESTORED"* ]]; then
              echo "> [!WARNING]"
              echo "> **\`$ENVIRONMENT\` is now behind main** (\`${MAIN:0:7}\`). The next deploy of main will re-ship"
              echo "> what was rolled back from. Fix forward or revert on main before deploying again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
