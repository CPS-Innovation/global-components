<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- STRATEGY: whitespace-only <title> (a single space). Tests whether a
       non-empty-but-blank title suppresses the URL announcement. -->
  <title> </title>
</head>

<body>
  <p>Redirecting back to the test rig&hellip;</p>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var parsed = parseInt(params.get('delay'), 10);
      var delay = isNaN(parsed) ? 0 : Math.max(0, parsed);
      setTimeout(function () {
        location.replace('./index.html?from=' + encodeURIComponent('Whitespace title'));
      }, delay);
    })();
  </script>
</body>

</html>
