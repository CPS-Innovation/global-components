<!DOCTYPE html>
<html lang="en" class="govuk-template">

<head>
  <title>Accessibility Settings - CPS Global Components</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function () {
      // The self-hosted GOV.UK stylesheet (govuk/, built by build-govuk.mjs) and
      // the global-components bundle (../global-components.js, built by another
      // package) are artifacts deployed ALONGSIDE this page, not inputs to its
      // Vite build. We inject them at runtime so Vite leaves the paths untouched
      // — a static <link>/<script> would be treated as a build entry and
      // bundled/hashed/rewritten. The stylesheet is added first so the browser
      // starts fetching it immediately.
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'govuk/govuk-frontend.min.css';
      document.head.appendChild(link);

      var s = document.createElement('script');
      s.type = 'module';
      s.src = '../global-components.js';
      document.head.appendChild(s);
    })();
  </script>
</head>

<body class="govuk-template__body">
  <script>document.body.className += ' js-enabled' + ('noModule' in HTMLScriptElement.prototype ? ' govuk-frontend-supported' : '');</script>

  <div class="govuk-width-container">
    <cps-global-header></cps-global-header>

    <main class="govuk-main-wrapper" id="main-content" role="main">
      <div id="root"></div>
    </main>
  </div>

  <cps-global-footer></cps-global-footer>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
