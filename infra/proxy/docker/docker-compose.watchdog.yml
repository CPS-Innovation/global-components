# Watchdog layer override
# Use: docker compose -f docker-compose.yml -f docker-compose.watchdog.yml up --build
#
# Mounts the conf and JS. GLOBAL_COMPONENTS_WATCHDOG_HOST is deliberately
# NOT set: the test pins what an unconfigured box does (the JSONP adapter names the
# setting, the hub route answers 503, nginx still starts), and whoami — answered
# locally, no upstream — is the health check.
#
# ENTRA_STATE_HMAC_SECRET IS set (a test value): it is Polaris's secret, which
# whoami uses to verify the handover-claims cookie, and the integration test
# packs its cookies with the same value.

services:
  nginx:
    environment:
      - ENTRA_STATE_HMAC_SECRET=integration-test-state-hmac-secret
    volumes:
      - ../config/global-components.watchdog/global-components.watchdog.conf:/etc/nginx/templates/features/global-components.watchdog/global-components.watchdog.conf.template:ro
      - ../dist/global-components.watchdog.js:/etc/nginx/templates/features/global-components.watchdog/global-components.watchdog.js:ro
