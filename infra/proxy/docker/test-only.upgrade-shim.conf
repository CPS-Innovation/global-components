# Test-only location exercising the $connection_upgrade shim used by
# config/global-components.case-locking/global-components.case-locking.conf.
# Mounted into the docker test stack via docker-compose volumes so it gets
# picked up by `include /etc/nginx/global-components*.conf;` in nginx.conf.
#
# The shim is the documented nginx alternative to a top-level
# `map $http_upgrade $connection_upgrade { ... }`, which lives in the http
# context only. We removed the map from main/nginx.conf, so the case-locking
# WebSocket-capable proxy blocks now derive $connection_upgrade locally with
# `set` + `if`. This test proves the technique forwards `Connection: upgrade`
# upstream when (and only when) the request carries an `Upgrade` header.
#
# The location proxies to the existing mock-upstream, which echoes the
# inbound Connection / Upgrade headers in its JSON response body.
location ~ ^/test/upgrade-shim/(.*)$ {
  set $connection_upgrade "";
  if ($http_upgrade) {
    set $connection_upgrade "upgrade";
  }
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_pass http://mock-upstream:3000/api/$1;
}
