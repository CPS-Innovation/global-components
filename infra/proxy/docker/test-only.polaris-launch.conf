# Test-only stand-ins for Polaris's own C-button launch routes, which live in
# Polaris's nginx config (see the reference copy, config/main/nginx-full.conf),
# not in this repo's docker stack. Same shape as theirs: PREFIX locations that
# return a fixed redirect.
#
# Mounted only for the multi-os-domain-testing layer, under a name matching the
# `global-components*.conf` include glob, so the integration tests can prove that
# the module's EXACT-match overrides hand a request without the signal cookie
# back to these blocks untouched — and leave routes they don't override alone.
# The targets are markers, not real URLs: the tests only compare Location headers.

location /launch/cin3-proxy {
  return 302 https://polaris-qa-notprod.cps.gov.uk/polaris?r=STAND-IN-cin3-proxy;
}

location /launch/cin3 {
  return 302 https://cin3.cps.gov.uk/polaris?r=STAND-IN-cin3;
}
