# Test-only stand-ins for Polaris's own C-button launch routes, which live in
# Polaris's nginx config (see the reference copy, config/main/nginx-full.conf),
# not in this repo's docker stack.
#
# Polaris serves these differently in its two worlds: the live monolith has a
# PREFIX location per route; the refactored config has one `location /launch/`
# handler that only recognises the EXACT route names. The stand-in for the
# diverted route is an EXACT-match location — the strictest of the two: only the
# original URI reaches it, and nginx would refuse to start if the module defined
# a location of its own on that URI. So passing here means the module's
# hand-back works in both worlds.
#
# Mounted only for the multi-os-domain-testing layer, under a name matching the
# `global-components*.conf` include glob. The targets are markers, not real
# URLs: the tests only compare Location headers.

location = /launch/cin3-proxy {
  return 302 https://polaris-qa-notprod.cps.gov.uk/polaris?r=STAND-IN-cin3-proxy;
}

location /launch/cin3 {
  return 302 https://cin3.cps.gov.uk/polaris?r=STAND-IN-cin3;
}
