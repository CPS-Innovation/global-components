# ---------------------------------------------------------------------------
# OS London/Dublin/oapps switch (FCT2-22132) — TRANSITIONAL
#
# Lets a user pin themselves to one OutSystems host for an environment: either of
# the resilient OutSystems failover domains (Dublin, *.outsystemsenterprise.com,
# and London, *lon*.outsystemsenterprise.com) or the oapps front door
# (oapps-*.int.cps.gov.uk, the environment's default). Users who never pin are
# untouched. See README.md beside this file.
#
# It exists for the move onto the oapps front door and can be deleted when that
# transition is finished (it may stay useful long term, for failover). Nothing
# else depends on it: it only ADDS locations, takes over config.json (exact
# match, see the main global-components conf's blob route), and adds one
# server-level rewrite that only fires for requests carrying the signal.
#
# Loads unchanged in BOTH Polaris proxy worlds (Polaris PROXY.md §6.8): the live
# monolith (`include global-components*.conf;`) and the refactored config
# (`include features/*/*.conf;`).
# ---------------------------------------------------------------------------

js_import glocoOsLondonDublinOappsSwitch from templates/features/global-components.os-london-dublin-oapps-switch/global-components.os-london-dublin-oapps-switch.js;

js_set $gloco_os_switch_config_blob glocoOsLondonDublinOappsSwitch.readConfigBlobName;
js_set $gloco_os_switch_launch glocoOsLondonDublinOappsSwitch.launchTarget;
js_set $gloco_os_switch_signalled glocoOsLondonDublinOappsSwitch.launchSignalled;

# ---- config.json selection -------------------------------------------------
#
# config.json is served as config.json or config.<variant>.json, chosen by
# readConfigBlobName from the page's Origin (OS pages) or the signal cookie
# (CWA). Exact-match locations win over the main conf's regex location for
# /global-components/<env>/..., so these take over config.json alone and leave
# every other artifact where it is. Each records its environment and hands over
# to one internal location, rather than repeating the proxy block per env.

location = /global-components/dev/config.json  { set $gloco_os_switch_config_env dev;  rewrite ^ /global-components/os-london-dublin-oapps-switch/config last; }
location = /global-components/test/config.json { set $gloco_os_switch_config_env test; rewrite ^ /global-components/os-london-dublin-oapps-switch/config last; }
location = /global-components/uat/config.json  { set $gloco_os_switch_config_env uat;  rewrite ^ /global-components/os-london-dublin-oapps-switch/config last; }
location = /global-components/prod/config.json { set $gloco_os_switch_config_env prod; rewrite ^ /global-components/os-london-dublin-oapps-switch/config last; }

location = /global-components/os-london-dublin-oapps-switch/config {
  internal;

  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  # As the main conf's artifact location (see its comments for the reasoning).
  gzip on;
  gzip_types application/json;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  # As mainline: blob storage's Content-MD5 is for the stored bytes, and stops
  # matching once nginx gzips the body.
  proxy_hide_header Content-MD5;
  add_header Access-Control-Allow-Origin * always;
  # The body depends on who is asking, so no shared cache may reuse it across them.
  add_header Vary "Origin, Cookie" always;
  add_header X-Gloco-Config $gloco_os_switch_config_blob always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_pass_request_headers off;
  proxy_set_header Host ${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN};
  proxy_pass https://${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN}/$gloco_os_switch_config_env/$gloco_os_switch_config_blob;
}

# ---- Proxied-CMS C-button --------------------------------------------------
#
# The proxied CMS's C-button points at /launch/<cin>-proxy (Polaris rewrites
# CMS's CASEWORK_TOOLS_URL to it in uainGeneratedScript.aspx). We do NOT define
# a location for those URLs — Polaris owns them, and they look different in each
# world (the monolith has a prefix location per route; the refactor has one
# `location /launch/` handler that only knows the exact route names). Instead:
#
#   - Server level, before any location is chosen: only when a signal cookie is
#     present on a C-button route ($gloco_os_switch_signalled, njs), the request is
#     diverted into our own internal location. Without the cookie, nginx never
#     touches the request and Polaris's route runs as today.
#     NOT a regex on $http_cookie: rewrite_log prints a regex `if`'s whole subject,
#     i.e. every request's Cookie header (bearer tokens, .CMSAUTH). See
#     launchSignalled in the njs.
#   - Our location: a valid signal for that route sends the user through the same
#     handover chain on the chosen host. Anything else (unknown host, another
#     environment's cookie) is rewritten back to the ORIGINAL URI. A rewrite from
#     inside a location goes straight to location matching and does not rerun the
#     server-level rewrite, so this cannot loop, and it lands on whichever
#     Polaris handler the running world has, with the request as it arrived.
#
# The click arrives in IE mode, so the cookie read is the IE-mode copy that the
# set route wrote. /polaris and /init then run completely unchanged.
# The route list here must match LAUNCH_ROUTES in the njs (unit-tested).

if ($gloco_os_switch_signalled) {
  rewrite ^/launch/(cin[2-5]-proxy)$ /global-components/os-london-dublin-oapps-switch/launch/$1 last;
}

location ~ ^/global-components/os-london-dublin-oapps-switch/launch/(cin[2-5]-proxy)$ {
  internal;
  if ($gloco_os_switch_launch = "") {
    rewrite ^/global-components/os-london-dublin-oapps-switch/launch/(.*)$ /launch/$1 last;
  }
  return 302 $gloco_os_switch_launch;
}

# ---- The switch (driven by the preview page, same-origin, so no CORS) -------

# The only writer of the signal: visits both engines to set/clear both copies.
location = /global-components/multi-os/set {
  js_content glocoOsLondonDublinOappsSwitch.handleSet;
}

location ~ ^/global-components/multi-os/target/(dev|test|uat|prod)$ {
  js_content glocoOsLondonDublinOappsSwitch.handleStatus;
}
