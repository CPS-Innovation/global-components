# ---------------------------------------------------------------------------
# global-components.vnext — the ADVANCE copy of our changes to Polaris's
# global-components feature (features/global-components/global-components.conf).
#
# We deploy this ourselves so the changes work now, while the PR carrying them
# into Polaris is reviewed. Once that PR is deployed, Polaris's locations take
# over and these stop answering — without anyone deleting anything. Then the
# section can go from here.
#
# HOW THAT WORKS — three strengths of location:
#
#   BRONZE  this file. REGEX locations only. A regex can never collide with
#           another location (nginx refuses to start on a duplicate `=` or `^~`,
#           never on a duplicate regex), so nothing here can take the proxy down.
#           Today they win: a regex beats Polaris's prefix locations outright,
#           and beats Polaris's regexes because features/global-components.vnext/
#           is loaded before features/global-components/ ('.' sorts before '/'
#           in the include glob).
#   SILVER  the PR. The same routes as `=` or `^~`, which beat every regex, so
#           the moment it deploys it wins over the bronze copy here.
#   GOLD    an emergency override of a mainline route that must survive mainline
#           (`=`/`^~` in one of our own features). Not used here.
#
# THE SIGNAL. Each location here adds `X-Gloco-Vnext: <route>`. While it is on
# the response, this file answered; when it is gone, Polaris's PR version did.
# The PR copies drop the header.
#
# MAPPING (do it when the PR is cut; each block says where it goes):
#   - the locations below -> global-components.conf, as `^~` (shapes noted);
#   - the njs -> global-components.js (its header marks what is COPIED vs OURS);
#   - js_var $gloco_vnext_mds_base_url -> however Polaris reads WM_MDS_BASE_URL
#     (avoid declaring a second variable of the same name).
#
# Retire a section here only when every environment this file is deployed to
# runs the PR version; a bronze section left behind is harmless meanwhile.
# ---------------------------------------------------------------------------

js_import glocovnext from templates/features/global-components.vnext/global-components.vnext.js;

# Passed to njs for the swagger body filter. Named for this file alone, so the
# PR can declare whatever it needs without a duplicate-variable clash.
js_var $gloco_vnext_mds_base_url ${WM_MDS_BASE_URL};

# ---- Swagger: MDS's doc + UI, with the doc rewritten to point at this proxy ---
#
# The Swagger UI page embeds the doc's ABSOLUTE upstream URL; the body filter
# rewrites it to https://<host>/global-components/api/swagger.json (the same
# mapping it applies to the doc's `servers`). That path would otherwise land on
# Polaris's unfiltered `~ ^/global-components/api/(.*)$`, so the UI would load
# an unrewritten doc and "Try it out" would go straight at the function app,
# which is unreachable from the CPS network. So /api/swagger... is served here
# too, with the api/ segment dropped before proxying (WM_MDS_BASE_URL already
# ends in /api/).
#
# PR shape: `location ^~ /global-components/swagger` plus
# `location ^~ /global-components/api/swagger` (both beat the api regex).
location ~ ^/global-components/(?:api/)?(.*swagger(\.json|/ui).*)$ {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header X-Gloco-Vnext swagger always;

  proxy_set_header x-functions-key "${WM_MDS_ACCESS_KEY}";
  proxy_set_header Accept-Encoding "";  # Disable compression for body filter
  proxy_pass ${WM_MDS_BASE_URL}$1;

  js_body_filter glocovnext.filterSwaggerBody buffer_type=string;
}

# ---- State: Polaris's route, plus JSONP (?callback=) and the dual-engine
# write (?set=) the IE-mode legacy clients need. GET and PUT are unchanged.
#
# The same regex as Polaris's own state location; ours is matched first.
# PR shape: `location ^~ /global-components/state/`, otherwise as below.
location ~ ^/global-components/state/(.*)$ {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;
  add_header X-Gloco-Vnext state always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;

  js_content glocovnext.handleState;
}

# ---- navigate-cms: Polaris's handler, plus target=modern (RNAV-43) ----------
#
# Polaris's location is the prefix `/global-components/navigate-cms`; any regex
# beats a prefix.
# PR shape: `location ^~ /global-components/navigate-cms` (so it beats this one).
#
# Polaris's location sets no headers, so it inherits the server-level security
# headers. Any add_header here switches that inheritance off (nginx: a level
# with its own add_header inherits none), so the X-Gloco-Vnext signal would
# silently strip them. They are repeated, as Polaris's nginx.conf sets them.
# The PR copy drops all of these and inherits again.
location ~ ^/global-components/navigate-cms {
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control "no-store" always;
  add_header Pragma "no-cache" always;
  add_header X-Gloco-Vnext navigate-cms always;

  js_content glocovnext.handleNavigateCms;
}
