js_import glocovnext from templates/global-components.vnext.js;

# Environment variables passed to njs (used by the swagger body filter)
js_var $wm_mds_base_url ${WM_MDS_BASE_URL};

# Utility to let us know if we are healthy or not
location = /global-components/status {
  js_content glocovnext.handleStatus;
}
# Handle swagger for MDS specially to filter the body
location ~ ^/global-components/(.*swagger(\.json|/ui).*)$ {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  proxy_set_header x-functions-key "${WM_MDS_ACCESS_KEY}";
  proxy_set_header Accept-Encoding "";  # Disable compression for body filter
  proxy_pass ${WM_MDS_BASE_URL}$1;

  js_body_filter glocovnext.filterSwaggerBody buffer_type=string;
}

# Allows other calls to validate Bearer token. Doesn't support
#  audience/scopes beyond standard MS ones
location = /global-components/validate-token {
    internal;
    resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
    js_fetch_verify off;
    js_content glocovnext.handleValidateToken;
}

# ---------------------------------------------------------------------------
# OS host variants (see OS_HOST_VARIANTS in global-components.vnext.ts)
#
# config.json is served as config.json or config.<variant>.json, chosen by
# readConfigBlobName from the page's Origin (OS pages) or the switch cookie
# (CWA). Exact-match locations win over the main conf's regex location for
# /global-components/<env>/..., so these take over config.json alone and leave
# every other artifact where it is. Each records its environment and hands over
# to one internal location, rather than repeating the proxy block per env.
# ---------------------------------------------------------------------------
js_set $gloco_config_blob glocovnext.readConfigBlobName;

location = /global-components/dev/config.json  { set $gloco_config_env dev;  rewrite ^ /global-components/__config last; }
location = /global-components/test/config.json { set $gloco_config_env test; rewrite ^ /global-components/__config last; }
location = /global-components/uat/config.json  { set $gloco_config_env uat;  rewrite ^ /global-components/__config last; }
location = /global-components/prod/config.json { set $gloco_config_env prod; rewrite ^ /global-components/__config last; }

location = /global-components/__config {
  internal;

  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  # As the main conf's artifact location (see its comments for the reasoning).
  gzip on;
  gzip_types application/json;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin * always;
  # The body depends on who is asking, so no shared cache may reuse it across them.
  add_header Vary "Origin, Cookie" always;
  add_header X-Gloco-Config $gloco_config_blob always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_pass_request_headers off;
  proxy_set_header Host ${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN};
  proxy_pass https://${CPS_GLOBAL_COMPONENTS_BLOB_STORAGE_DOMAIN}/$gloco_config_env/$gloco_config_blob;
}

# The switch itself, driven by the preview page (same-origin, so no CORS).
location ~ ^/global-components/os-target/(dev|test|uat|prod)$ {
  js_content glocovnext.handleOsTarget;
}
