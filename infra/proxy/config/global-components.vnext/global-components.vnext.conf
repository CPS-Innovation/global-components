js_import glocovnext from templates/global-components.vnext.js;

# Environment variables passed to njs (used by the swagger body filter)
js_var $wm_mds_base_url ${WM_MDS_BASE_URL};

# Reclaim the swagger URLs that the API regex would otherwise swallow.
#
# The Swagger UI page embeds the doc's ABSOLUTE upstream URL, so the body filter
# below rewrites it to https://<host>/global-components/api/swagger.json — the
# same mapping it applies to the doc's `servers` entry. But that path is claimed
# by `location ~ ^/global-components/api/(.*)$` in global-components.conf, which
# nginx includes BEFORE this file (the glob sorts alphabetically) and which has
# no js_body_filter. The UI would therefore load an UNREWRITTEN doc and fire
# "Try it out" straight at the function app, which is unreachable from the CPS
# network.
#
# A `^~` prefix location outranks every regex regardless of include order, so
# this reclaims those URLs and hands them to the filtered location below.
# Rewriting rather than duplicating the proxy block keeps one copy of the
# upstream config.
location ^~ /global-components/api/swagger {
  rewrite ^/global-components/api/(.*)$ /global-components/$1 last;
}

# Handle swagger for MDS specially to filter the body
location ~ ^/global-components/(.*swagger(\.json|/ui).*)$ {
  error_page 418 = @gloco_preflight;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  proxy_set_header x-functions-key "${WM_MDS_ACCESS_KEY}";
  proxy_set_header Accept-Encoding "";  # Disable compression for body filter
  proxy_pass ${WM_MDS_BASE_URL}$1;

  js_body_filter glocovnext.filterSwaggerBody buffer_type=string;
}

# Allows other calls to validate Bearer token. Doesn't support
#  audience/scopes beyond standard MS ones
location = /global-components/validate-token {
    internal;
    resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
    js_fetch_verify off;
    js_content glocovnext.handleValidateToken;
}

