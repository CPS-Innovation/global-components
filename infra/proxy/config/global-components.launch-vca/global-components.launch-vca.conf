# ---------------------------------------------------------------------------
# /launch-vca — open the Victims Case Application logged in — EXPERIMENTAL
#
# Serves a page that finds the user's live CMS session (JSONP probes of each CMS
# handover endpoint, first success wins) and hands them over to VCA through it.
# See README.md beside this file.
#
# Removable: one exact-match location on a path nothing else uses (Polaris's
# launch routes are all under /launch/). Delete the module and the URL 404s.
#
# Loads unchanged in BOTH Polaris proxy worlds (Polaris PROXY.md §6.8): the live
# monolith (`include global-components*.conf;`) and the refactored config
# (`include features/*/*.conf;`).
# ---------------------------------------------------------------------------

js_import glocoLaunchVca from templates/features/global-components.launch-vca/global-components.launch-vca.js;

location = /launch-vca {
  js_content glocoLaunchVca.handleLaunchVca;
}
