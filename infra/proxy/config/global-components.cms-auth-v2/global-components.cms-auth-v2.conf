# CMS Auth V2
#
# Self-contained OIDC round-trip: /polaris-v2 -> /init-v2/ -> AD -> /init-v2/callback
# First pass ends on a diagnostic HTML page.

js_import cmsauthv2 from templates/global-components.cms-auth-v2.js;

# NOTE: there is deliberately NO location for /CMS.24.0.01/User/uaulLogin.aspx here.
# It previously existed only to inject the login-ping iframe on successful login;
# that job moved into the injected shell script (cms-auth-v2-client.js), which
# watches frameMain leave uaulLogin.aspx and spawns the iframe itself. The rest of
# that block was a verbatim copy of the deployed ^/CMS.* catch-all, so the login
# page now simply falls through to the catch-all and is proxied identically.

# ============================================================================
# CMS Auth V2 — client-script injection (POC / spike)
#
# Inject a <script src> into the persistent CMS frameset shell (uaglCMS.aspx —
# the top window that lives for the whole CMS session), so the script runs once
# per session and can host the token-refresh timer.
#
# The script itself needs NO new location: the existing blob route in
# config/main/global-components.conf already serves the storage containers —
#     ^/global-components/(dev|test|uat|prod)/(.*)$  ->  <blob-domain>/$1/$2
# so a file in the 'test' container is reachable at /global-components/test/<file>.
#
# Anchor on </head> (NOT </html>): uaglCMS.aspx is a <frameset> doc and a script
# after </frameset> is an invalid position — head scripts run. Exact `=` beats
# the deployed ^/CMS.* catch-all for this one URL. Path is version-pinned (a
# regex ~ ^/CMS\.[^/]+/uaglCMS\.aspx$ would survive CMS upgrades, but exact
# match is safest here).
# ============================================================================
location = /CMS.24.0.01/uaglCMS.aspx {
    client_max_body_size 0;
    access_log  /dev/stdout cms_log;
    limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
    add_header 'x-limit-req-status' $limit_req_status always;

    # IE Mode Desired
    if ( $ieaction = 'nonie+nonconfigurable+') {
      return 402 'requires Internet Explorer mode';
    }
    if ( $ieaction = 'nonie+configurable+') {
      add_header X-InternetExplorerMode 1;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }

    # Determine proxy location and CMS domain
    js_set $proxyDestination cmsenv.proxyDestinationCorsham;
    js_set $upstreamCmsDomainName cmsenv.upstreamCmsDomainName;
    js_set $upstreamCmsModernDomainName cmsenv.upstreamCmsModernDomainName;
    js_set $upstreamCmsServicesDomainName cmsenv.upstreamCmsServicesDomainName;

    sub_filter_types *;
    sub_filter_once off;
    sub_filter https:// ${WEBSITE_SCHEME}://;

    # Inject our client script into the frameset shell's <head>.
    sub_filter '</head>' '<script type="text/javascript" src="/global-components/test/cms-auth-v2-client.js"></script></head>';

    sub_filter $upstreamCmsModernDomainName $host;
    sub_filter $upstreamCmsServicesDomainName $host;
    sub_filter $upstreamCmsDomainName $host;

    # Disable gzip so sub_filter can inspect the body
    proxy_set_header Accept-Encoding "";

    proxy_redirect ~^(http|https)://[^/]+(/.*)?$ ${WEBSITE_SCHEME}://$host$2;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse off;
    proxy_ssl_verify off;

    proxy_set_header Host $upstreamCmsDomainName:443;
    proxy_set_header X-Forwarded-For $remote_addr;

    proxy_pass $proxyDestination;
}

# ===========================================================================
# Presence POC — inject the bundled presence client into CMS Modern and DCF.
#
# Both apps are served through the catch-all `location /` in main/nginx-full.conf
# (proxying to the CMS *Modern* upstream). These two narrower locations beat that
# prefix match — an exact `=` match and a regex `~` match both win — and differ
# from it only by ONE extra sub_filter, which drops our <script> into <head>.
# Everything else is copied verbatim so these paths behave exactly as before.
#
#   /viewer/landing        CMS Modern (AngularJS, hash-routed:
#                            #/case-summary/<caseId>, #/disclosure/<caseId>)
#   /dcf/review/...        DCF (React, path-routed:
#                            /dcf/review/<caseId>/<userGuid>)
#
# ONE script serves both: it reads the case from the URL either way. Both run in
# Edge IE mode at document mode 11, so the bundle is ES5 throughout (es6-promise
# + SignalR 3.1 + our glue). See cms-presence-client/README.md.
#
# To cover more DCF screens, widen the regex (e.g. ^/dcf/(?!static/|constants\.js)).
# ===========================================================================
location = /viewer/landing {
    access_log  /dev/stdout cms_log;
    limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
    add_header 'x-limit-req-status' $limit_req_status always;

    # Determine proxy location and CMS domain
    js_set $proxyDestinationModern cmsenv.proxyDestinationModernCorsham;
    js_set $upstreamCmsModernDomainName cmsenv.upstreamCmsModernDomainName;
    js_set $upstreamCmsDomainName cmsenv.upstreamCmsDomainName;
    js_set $upstreamCmsServicesDomainName cmsenv.upstreamCmsServicesDomainName;

    sub_filter_once off;
    # NB: text/html is always included by nginx and must NOT be listed again
    # ("duplicate MIME type" warning at startup).
    sub_filter_types text/xml text/css text/javascript application/json application/javascript;
    sub_filter https:// ${WEBSITE_SCHEME}://;

    # Inject the presence client.
    sub_filter '</head>' '<script type="text/javascript" src="/global-components/test/cms-presence-client.js"></script></head>';

    sub_filter $upstreamCmsModernDomainName $host;
    sub_filter $upstreamCmsServicesDomainName $host;
    sub_filter $upstreamCmsDomainName $host;

    # Disable gzip so sub_filter can inspect the body
    proxy_set_header Accept-Encoding "";

    proxy_redirect     off;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse off;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $upstreamCmsModernDomainName:443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Via "Polaris-Proxy";

    rewrite ^/(.*) /$1 break;
    proxy_pass $proxyDestinationModern$request_uri;
}

location ~ ^/dcf/review/ {
    access_log  /dev/stdout cms_log;
    limit_req zone=cmsproxy burst=${CMS_RATE_LIMIT_QUEUE};
    add_header 'x-limit-req-status' $limit_req_status always;

    # Determine proxy location and CMS domain
    js_set $proxyDestinationModern cmsenv.proxyDestinationModernCorsham;
    js_set $upstreamCmsModernDomainName cmsenv.upstreamCmsModernDomainName;
    js_set $upstreamCmsDomainName cmsenv.upstreamCmsDomainName;
    js_set $upstreamCmsServicesDomainName cmsenv.upstreamCmsServicesDomainName;

    sub_filter_once off;
    # NB: text/html is always included by nginx and must NOT be listed again
    # ("duplicate MIME type" warning at startup).
    sub_filter_types text/xml text/css text/javascript application/json application/javascript;
    sub_filter https:// ${WEBSITE_SCHEME}://;

    # Inject the presence client.
    sub_filter '</head>' '<script type="text/javascript" src="/global-components/test/cms-presence-client.js"></script></head>';

    sub_filter $upstreamCmsModernDomainName $host;
    sub_filter $upstreamCmsServicesDomainName $host;
    sub_filter $upstreamCmsDomainName $host;

    # Disable gzip so sub_filter can inspect the body
    proxy_set_header Accept-Encoding "";

    proxy_redirect     off;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse off;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $upstreamCmsModernDomainName:443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Via "Polaris-Proxy";

    rewrite ^/(.*) /$1 break;
    proxy_pass $proxyDestinationModern$request_uri;
}

location /polaris-v2 {
    # Coerce into IE mode (mirrors /polaris and /CMS.* in the main config) BEFORE
    # capturing cookies. The F5 load-balancer cookie ([CF]-<TOKEN>-LBsessioncookie)
    # is set in the IE-mode cookie jar and is NOT shared into Edge mode (only the
    # group-policy-shared cookies cross over), so a request executing in Edge never
    # sees it. Requesting IE mode makes the browser re-issue this call in the IE jar
    # where the LB cookie is present, so handlePolarisV2 can capture it.
    #
    # ie+* (already IE) and *+nonconfigurable+ fall through to js_content unchanged,
    # so this is a no-op for the integration tests (non-Trident, non-configurable).
    if ( $ieaction = 'nonie+configurable+') {
      add_header X-InternetExplorerMode 1;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }
    js_content cmsauthv2.handlePolarisV2;
}

location = /init-v2/ {
    # STAY IN IE MODE through the AD hop. The whole flow runs inside a hidden iframe
    # on the (IE-mode) CMS login page. Azure AD's prompt=none only returns a silent
    # 302 if the browser sends AD's SSO session cookie to the framed
    # login.microsoftonline.com — a THIRD-PARTY cookie, which IE mode sends but Edge
    # mode blocks. If we flip to Edge here, framed AD can't see the session, renders,
    # and X-Frame-Options → "This content cannot be displayed in a frame". Keeping IE
    # is how the OID-keyed rows were captured for months.
    #
    # Trade-off: the state cookie (cms_auth_state) is then set + read in the IE jar,
    # which is consistent for the framed flow. (Top-level testing may show "Missing
    # State" because top-level AD forces the tab to Edge — use ?edge=1 to run the
    # whole top-level flow in Edge instead, so the cookie is set + read in one jar.
    # A more robust fix is to make state jar-independent, e.g. carry it in the OAuth
    # state param.)
    resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
    js_fetch_verify off;
    js_content cmsauthv2.handleInitV2;
}

location = /init-v2/callback {
    # Stay in IE — same jar the state cookie was set in at /init-v2/, and where the
    # framed AD round-trip stays cookie-visible. (See the /init-v2/ note above.)
    #
    # Allow the SAME-ORIGIN CMS page to frame this page. The deployed proxy stamps
    # X-Frame-Options: DENY on responses, which blocks the callback from rendering in
    # the login-page iframe ("forbidframing" — storage still writes because that's
    # server-side, but the client script never runs). An add_header at this location
    # REPLACES the inherited one, so only SAMEORIGIN applies here. The CMS page and
    # this callback are same-origin, so SAMEORIGIN lets it frame while still blocking
    # cross-origin. (If DENY comes from a fronting gateway rather than nginx, this
    # won't override it and the gateway must be adjusted.)
    add_header X-Frame-Options "SAMEORIGIN" always;
    resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
    js_fetch_verify off;
    js_content cmsauthv2.handleInitV2Callback;
}

location = /init-v2/error {
    js_content cmsauthv2.handleInitV2Error;
}

location = /global-components/cms-modern-token-v2 {
    resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
    js_fetch_verify off;
    js_content cmsauthv2.handleCmsModernToken;
}

# ============================================================================
# CMS presence API — same-origin proxy for the presence relay.
#
# The presence relay (cms-presence-relay.html, served on this polaris origin) makes
# the session / heartbeat / poll calls to the CMS presence API. The CMS page itself
# cannot call cross-origin (the IE Internet-zone "Access data sources across domains"
# = Prompt — see cms-presence-relay.html and reference_cms_polaris_xorigin_zone), so
# the relay — same-origin with this route — does it. Clean 1:1 mapping:
#     /global-components/presence/<X>  ->  app-cms-presence-api  /api/<X>
#
# NB: proxy_pass has NO variable, so nginx resolves the host at LOAD time via the
# SYSTEM resolver (/etc/resolv.conf -> 127.0.0.11), which returns the private-endpoint
# IP. A runtime `resolver ${WEBSITE_DNS_SERVER}` (168.63.129.16) NXDOMAINs on the
# privatelink name and 502s — do not "fix" it by adding one. The rewrite maps the
# path; the query string is preserved. Authorization header + method pass through by
# nginx default (same-origin, so no CORS/preflight needed).
# ============================================================================
location ~ ^/global-components/presence/(.*)$ {
    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_set_header Host app-cms-presence-api.azurewebsites.net;
    proxy_set_header Accept-Encoding "";
    rewrite ^/global-components/presence/(.*)$ /api/$1 break;
    proxy_pass https://app-cms-presence-api.azurewebsites.net;
}

# ============================================================================
# Clear cookies (debug) — coerce to IE mode, then EXPIRE every cookie the
# browser sent. Done server-side (handleClearCookies emits Set-Cookie), so
# HttpOnly cookies are cleared too — JS can't delete those. Best-effort scope:
# Path=/ across host-only + the host + parent domains (see the handler; cookies
# pinned to a deeper Path can't be cleared blind). Remove when the hunt is over.
# ============================================================================
location = /global-components/diagnostic/clear-cookies {
    # Ensure IE mode — clear in the IE jar where the problem cookie lives.
    if ( $ieaction = 'nonie+nonconfigurable+') {
      return 402 'requires Internet Explorer mode';
    }
    if ( $ieaction = 'nonie+configurable+') {
      add_header X-InternetExplorerMode 1;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }
    js_content cmsauthv2.handleClearCookies;
}

# ============================================================================
# Cookie diagnostic (debug) — coerce to IE mode, then echo every cookie the
# browser sent. Rendered SERVER-SIDE from $http_cookie (the request Cookie
# header), so HttpOnly cookies ARE included — document.cookie in the browser
# would miss them. The inline JS only splits that server-rendered string for
# readability; it never reads document.cookie. Remove when the hunt is over.
# ============================================================================
location = /global-components/diagnostic {
    # Ensure IE mode — the problem cookie may live only in the IE cookie jar.
    if ( $ieaction = 'nonie+nonconfigurable+') {
      return 402 'requires Internet Explorer mode';
    }
    if ( $ieaction = 'nonie+configurable+') {
      add_header X-InternetExplorerMode 1;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }

    default_type text/html;
    add_header Cache-Control "no-store";
    return 200 '<html><head><title>Cookie diagnostic</title></head><body><h1>Cookies the browser sent</h1><p>document.documentMode = <b id="dm"></b></p><h2>Itemised</h2><ol id="list"></ol><h2>Raw Cookie header</h2><pre id="raw">$http_cookie</pre><script>var pre=document.getElementById("raw");var raw=(pre&&pre.firstChild)?pre.firstChild.nodeValue:"";var parts=raw.split("; ");var ol=document.getElementById("list");var i,eq,nm,vl,li;for(i=0;i<parts.length;i++){if(parts[i]===""){continue;}eq=parts[i].indexOf("=");nm=(eq===-1)?parts[i]:parts[i].substring(0,eq);vl=(eq===-1)?"":parts[i].substring(eq+1);li=document.createElement("li");li.appendChild(document.createTextNode(nm+"  (len "+vl.length+")  =  "+vl));ol.appendChild(li);}var dm=document.getElementById("dm");if(dm){dm.appendChild(document.createTextNode(""+document.documentMode));}</script></body></html>';
}
