js_import glocoCaseLocking from templates/global-components.case-locking.js;

# Proxy Azure SignalR Service (path injected by filterNegotiateBody so the
#  client connects same-origin instead of cross-origin to *.service.signalr.net).
#  Must come BEFORE the /api/(.*) block so the more-specific regex wins.
location ~ ^/global-components/case-locking/api/sr/(.*)$ {
  error_page 418 = @gloco_preflight_case_locking;
  if ($request_method = OPTIONS) {
    return 418;
  }

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_set_header Host sr-cms-presence.service.signalr.net;

  # Inline the $connection_upgrade map so we don't have to add it to the
  # shared main nginx.conf. `if` + `set` is the documented escape hatch when
  # `map` (http-context only) isn't available.
  set $connection_upgrade "";
  if ($http_upgrade) {
    set $connection_upgrade "upgrade";
  }
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  proxy_pass https://sr-cms-presence.service.signalr.net/$1$is_args$args;
}

# Proxy SignalR presence hub for case-locking PoC (WebSocket-capable).
# The negotiate response is rewritten via js_body_filter to redirect the client
# at our same-origin /api/sr/ path instead of *.service.signalr.net.
location ~ ^/global-components/case-locking/api/(.*)$ {
  error_page 418 = @gloco_preflight_case_locking;
  if ($request_method = OPTIONS) {
    return 418;
  }

  # Authorization: pass through whatever the client sent, else lift it from the
  # HttpOnly cookie the auth callback stamped. The CMS estate (IE mode) cannot set
  # the header itself — a page cannot set headers on a WebSocket handshake, and the
  # usual fallback (SignalR's negotiate XHR) is barred cross-domain by Windows zone
  # setting 1406 — whereas global-components authenticates conventionally and sends
  # its own. proxy_set_header replaces unconditionally, so presenceBearer MUST
  # return the incoming header when there is one or it would be stripped.
  # It returns "" when there is neither, and nginx omits a header set to an empty
  # value — an unauthenticated request stays unauthenticated.
  js_set $presence_bearer glocoCaseLocking.presenceBearer;
  proxy_set_header Authorization $presence_bearer;

  # The calling application, lifted from the connect URL's ?appName= into the
  # header the presence API wants. The client also passes it as the Connect hub
  # argument (the real contract); this is the tactical duplicate, because the hub
  # argument travels inside WebSocket frames the proxy cannot read. Unrecognised
  # values yield "" and nginx omits the header.
  js_set $watchdog_app_name glocoCaseLocking.watchdogAppName;
  proxy_set_header X-Watchdog-App-Name $watchdog_app_name;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_verify off;
  proxy_set_header Host app-cms-presence-api.azurewebsites.net;
  proxy_set_header Accept-Encoding "";  # disable upstream compression for body filter

  set $connection_upgrade "";
  if ($http_upgrade) {
    set $connection_upgrade "upgrade";
  }
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  proxy_pass https://app-cms-presence-api.azurewebsites.net/$1$is_args$args;

  js_header_filter glocoCaseLocking.dropContentLengthForNegotiate;
  js_body_filter glocoCaseLocking.filterNegotiateBody buffer_type=string;
}

# Feature-local preflight handler. Mirrors the shared @gloco_preflight in
# main/global-components.conf but adds X-Requested-With and X-SignalR-User-Agent
# to the allow-headers list (both sent by the SignalR client on negotiate POSTs).
# We keep this here because the shared handler isn't ours to modify on the
# deployed nginx box.
location @gloco_preflight_case_locking {
  internal;
  add_header Access-Control-Allow-Origin $cors_origin;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
  add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Correlation-Id, X-Application, Cms-Auth-Values, X-Requested-With, X-SignalR-User-Agent';
  add_header Access-Control-Allow-Credentials true;
  add_header Access-Control-Max-Age 86400;
  add_header Content-Length 0;
  add_header Content-Type 'text/plain';
  return 204;
}
