load_module modules/ngx_http_js_module.so;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;
  error_log /dev/stderr debug;

  sendfile on;
  keepalive_timeout 65;
  js_import nginx.js;

  # ---------------------------------------------------------------------------
  # Plumbing required by the cms-auth-v2 login-page shim (uaulLogin.aspx) so its
  # nginx starts. Inert on the global-components proxy this config deploys to —
  # that bundle has no v2 conf, so nothing references cmsenv / cms_log / cmsproxy.
  # The real cmsenv.js ships alongside (copied by Dockerfile.base + build.sh); the
  # docker cms-auth-v2 test layer mounts a reduced mock over it (see
  # docker-compose.cms-auth-v2.yml).
  # ---------------------------------------------------------------------------
  js_import cmsenv.js;
  log_format cms_log 'CMS-LOG: $remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent $request_time '
    '"$http_referer" "$upstream_addr" "CMS-USER-ID:$cookie_UID"';
  # Literal rate (not ${CMS_RATE_LIMIT}) so this config carries no new env dep.
  limit_req_zone cmsproxy zone=cmsproxy:1m rate=1000r/s;
  limit_req_status 429;

  server {
    listen 8080;
    server_name localhost;

    set $ieaction '';
    if ( $http_x_internetexplorermodeconfigurable = 1) {
        set $ieaction "configurable+${ieaction}";
    }
    if ($http_x_internetexplorermodeconfigurable != 1) {
        set $ieaction "nonconfigurable+${ieaction}";
    }
    if ( $http_user_agent ~* Trident ) {
        set $ieaction "ie+${ieaction}";
    }
    if ( $http_user_agent !~* Trident ) {
        set $ieaction "nonie+${ieaction}";
    }

    # DNS resolver (configurable via WEBSITE_DNS_SERVER env var)
    resolver ${WEBSITE_DNS_SERVER} valid=30s;

    # Health check
    location /health {
      add_header Content-Type text/plain;
      return 200 'OK';
    }

    ################################################################################
    ################################################################################
    ################################################################################
    # We only need the relevant directives from the main config
    ################################################################################
    ################################################################################
    ################################################################################
    
    location /init {
      js_content nginx.appAuthRedirect;
    }

    location /polaris {
      js_var $redirectHostAddress http://$host;
      js_content nginx.polarisAuthRedirect;
    }

    location /auth-refresh-outbound {
      js_content nginx.handleAuthRefreshOutbound;
    }

    include /etc/nginx/global-components*.conf;
  }
}
