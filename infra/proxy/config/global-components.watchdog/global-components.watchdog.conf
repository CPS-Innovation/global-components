# Watchdog — the proxy in front of the Watchdog (presence) API. See the header of
# global-components.watchdog.js for the two transports and why they share a module.
#
# The .js sits beside this conf in its features/ folder (deploy.local.sh uploads both).
js_import glocoWatchdog from templates/features/global-components.watchdog/global-components.watchdog.js;

# The upstream host comes from njs (app setting -> deploy-time value -> ""), never a
# literal: a literal proxy_pass host is resolved at START-UP, and one that fails to
# resolve stops nginx — the whole proxy, not just these routes. From a variable it is
# resolved per request via the location's resolver. js_set names are server-global,
# hence gc_.
js_set $gc_watchdog_host glocoWatchdog.watchdogHost;

# ============================================================================
# The Watchdog hub (WebSocket-capable). UAT ONLY, until UAT goes direct.
#
# QA's global-components negotiate with the Watchdog directly (CASE_LOCKING_API_URL
# names it, not this route). UAT's config still names this route; delete this
# location, presenceBearer and watchdogAppName when it stops.
#
# Its negotiate response hands the browser to the Azure SignalR Service
# (https://<instance>.service.signalr.net), and the browser connects there
# DIRECTLY. Until 2026-11-12 this proxy rewrote that URL to a same-origin route and
# relayed the connection; the dev Watchdog's instance is a private endpoint that
# user devices can reach (through the corporate access client) but this proxy
# cannot, so the relay only added a hop that failed. Host apps that enforce a CSP
# must allow the instance in connect-src: CASE_LOCKING_SIGNALR_ORIGIN in config
# feeds generated/csp.
# ============================================================================
location ~ ^/global-components/case-locking/api/(.*)$ {
  error_page 418 = @gloco_preflight_watchdog;
  if ($request_method = OPTIONS) {
    return 418;
  }

  # Authorization: pass through whatever the client sent, else lift it from the
  # HttpOnly presence-token cookie. The CMS estate (IE mode) cannot set the header
  # itself — a page cannot set headers on a WebSocket handshake, and the usual
  # fallback (SignalR's negotiate XHR) is barred cross-domain by Windows zone
  # setting 1406 — whereas global-components authenticates conventionally and sends
  # its own. proxy_set_header replaces unconditionally, so presenceBearer MUST
  # return the incoming header when there is one or it would be stripped.
  # It returns "" when there is neither, and nginx omits a header set to an empty
  # value — an unauthenticated request stays unauthenticated.
  js_set $presence_bearer glocoWatchdog.presenceBearer;
  proxy_set_header Authorization $presence_bearer;

  # The calling application, lifted from the connect URL's ?appName= into the
  # header the presence API wants. The client also passes it as the Connect hub
  # argument (the real contract); this is the tactical duplicate, because the hub
  # argument travels inside WebSocket frames the proxy cannot read. Unrecognised
  # values yield "" and nginx omits the header.
  js_set $watchdog_app_name glocoWatchdog.watchdogAppName;
  proxy_set_header X-Watchdog-App-Name $watchdog_app_name;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials true always;

  # Setting absent: this route alone answers 503; nginx still starts.
  if ($gc_watchdog_host = "") {
    return 503 "watchdog: GLOBAL_COMPONENTS_WATCHDOG_HOST not configured\n";
  }

  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  proxy_ssl_server_name on;
  proxy_ssl_name $gc_watchdog_host;
  proxy_ssl_verify off;
  proxy_set_header Host $gc_watchdog_host;

  set $connection_upgrade "";
  if ($http_upgrade) {
    set $connection_upgrade "upgrade";
  }
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  proxy_pass https://$gc_watchdog_host/$1$is_args$args;

}

# ============================================================================
# CMS presence API — JSONP adapter.
#
# The injected CMS clients can't XHR cross-origin (IE zone), but CAN load a
# <script src> cross-origin. So they fetch presence via JSONP and this handler
# shims each GET into the backend's real POST/PUT/GET/DELETE, lifts the token
# from the HttpOnly cookie into an Authorization header (token never in the URL),
# and wraps the JSON as callback(...). See handlePresenceJsonp.
#
# Same Watchdog as the hub above, from the same setting — so the legacy clients
# and the web components can never register with different Watchdogs.
# ============================================================================
location = /global-components/presence-jsonp {
  resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
  js_fetch_verify off;
  js_content glocoWatchdog.handlePresenceJsonp;
}

# whoami on its own sub-path (RPLT-246). Polaris's /init sets the handover-claims
# cookie (the reader's Entra groups, signed) with Path= exactly this, so it rides
# whoami — once a minute — and never the 3-second polls on the base path above.
# The presence token's Path is the base path, a prefix of this one, so it arrives
# too and whoami can bind the groups to the same reader (oid).
# Answered in njs; no upstream, so no resolver. The base path's ?op=whoami stays
# until every client has moved here.
location = /global-components/presence-jsonp/whoami {
  js_content glocoWatchdog.handlePresenceWhoami;
}

# Feature-local preflight handler. Mirrors the shared @gloco_preflight in
# main/global-components.conf but adds X-Requested-With and X-SignalR-User-Agent
# to the allow-headers list (both sent by the SignalR client on negotiate POSTs).
# We keep this here because the shared handler isn't ours to modify on the
# deployed nginx box.
location @gloco_preflight_watchdog {
  internal;
  add_header Access-Control-Allow-Origin $cors_origin;
  add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
  add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Correlation-Id, X-Application, Cms-Auth-Values, X-Requested-With, X-SignalR-User-Agent';
  add_header Access-Control-Allow-Credentials true;
  add_header Access-Control-Max-Age 86400;
  add_header Content-Length 0;
  add_header Content-Type 'text/plain';
  return 204;
}
