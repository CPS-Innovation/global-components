# ============================================================================
# Non-DDEI CMS auth handover (throwaway PROOF)
#
# Replicates the production /polaris -> /init -> DDEI /api/init/ chain entirely
# in njs, proving PolarisDDEI's AuthHandover can be severed. Deployed OUT-OF-BAND
# (drop this .conf + the compiled .js on the server; picked up by the main
# config's `include global-components*.conf`). No secrets, no Azure AD.
#
# Entry: /polaris-non-ddei  (in place of the production /polaris).
# See global-components.polaris-non-ddei.ts for the flow + the deliberate
# simplifications (no LB retry, /polaris-ui/go for case launch, etc.).
# ============================================================================

js_import nonddei from templates/global-components.polaris-non-ddei.js;

# Step 1 — capture the CMS cookies. Force IE (mirrors /polaris) so the request
# runs in the IE cookie jar where the F5 LB cookie + CMS cookies live.
location = /polaris-non-ddei {
    if ( $ieaction = 'nonie+configurable+') {
      add_header X-InternetExplorerMode 1;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }
    js_content nonddei.handlePolarisNonDdei;
}

# Step 2 — establish the Polaris session (the DDEI /api/init/ replacement). Force
# Edge (mirrors /init) so the app context + the Cms-Auth-Values cookie land in
# the Edge jar. The token mint + GraphQL verify are server-side $host loopback
# fetches (they carry a spoofed Trident UA, so they pass the ^/CMS.* IE gate),
# hence the resolver + js_fetch_verify off.
location = /init-non-ddei {
    if ( $ieaction = 'ie+nonconfigurable+') {
      return 402 'requires non-internet explorer mode';
    }
    if ( $ieaction = 'ie+configurable+') {
      add_header X-InternetExplorerMode 0;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }
    resolver ${WEBSITE_DNS_SERVER} ipv6=off valid=30s;
    js_fetch_verify off;
    js_content nonddei.handleInitNonDdei;
}
