}

# ############################################################################
# TEMPORARY TAIL — everything below moves to Polaris's global-components module
# (config/main in this repo is the copy we PR from). Once theirs is deployed,
# delete from here down, plus the js_import at the top and the .ts.
# ############################################################################

# ============================================================================
# Clear cookies (debug) — coerce to IE mode, then EXPIRE every cookie the
# browser sent. Done server-side (handleClearCookies emits Set-Cookie), so
# HttpOnly cookies are cleared too — JS can't delete those. Best-effort scope:
# Path=/ across host-only + the host + parent domains (see the handler; cookies
# pinned to a deeper Path can't be cleared blind). Remove when the hunt is over.
# ============================================================================
location = /global-components/diagnostic/clear-cookies {
    # Ensure IE mode — clear in the IE jar where the problem cookie lives.
    if ( $ieaction = 'nonie+nonconfigurable+') {
      return 402 'requires Internet Explorer mode';
    }
    if ( $ieaction = 'nonie+configurable+') {
      add_header X-InternetExplorerMode 1;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }
    js_content glocoCmsAugmentation.handleClearCookies;
}

# ============================================================================
# Cookie diagnostic (debug) — coerce to IE mode, then echo every cookie the
# browser sent. Rendered SERVER-SIDE from $http_cookie (the request Cookie
# header), so HttpOnly cookies ARE included — document.cookie in the browser
# would miss them. The inline JS only splits that server-rendered string for
# readability; it never reads document.cookie. Remove when the hunt is over.
# ============================================================================
location = /global-components/diagnostic {
    # Ensure IE mode — the problem cookie may live only in the IE cookie jar.
    if ( $ieaction = 'nonie+nonconfigurable+') {
      return 402 'requires Internet Explorer mode';
    }
    if ( $ieaction = 'nonie+configurable+') {
      add_header X-InternetExplorerMode 1;
      return 302 "${WEBSITE_SCHEME}://${host}${request_uri}";
    }

    default_type text/html;
    add_header Cache-Control "no-store";
    return 200 '<html><head><title>Cookie diagnostic</title></head><body><h1>Cookies the browser sent</h1><p>document.documentMode = <b id="dm"></b></p><h2>Itemised</h2><ol id="list"></ol><h2>Raw Cookie header</h2><pre id="raw">$http_cookie</pre><script>var pre=document.getElementById("raw");var raw=(pre&&pre.firstChild)?pre.firstChild.nodeValue:"";var parts=raw.split("; ");var ol=document.getElementById("list");var i,eq,nm,vl,li;for(i=0;i<parts.length;i++){if(parts[i]===""){continue;}eq=parts[i].indexOf("=");nm=(eq===-1)?parts[i]:parts[i].substring(0,eq);vl=(eq===-1)?"":parts[i].substring(eq+1);li=document.createElement("li");li.appendChild(document.createTextNode(nm+"  (len "+vl.length+")  =  "+vl));ol.appendChild(li);}var dm=document.getElementById("dm");if(dm){dm.appendChild(document.createTextNode(""+document.documentMode));}</script></body></html>';
}

# ============================================================================
# PREVIEW STATE — USURPED FROM POLARIS, ON PURPOSE.
#
# This path belongs to main/global-components.conf:
#   location ~ ^/global-components/state/(.*)$   ->  gloco.handleState
# which lives in the POLARIS repo (polaris-terraform/main-terraform) and ships
# with their terraform, not with our deploy.local.sh. An EXACT-match location
# beats a regex wherever it is defined — the same rule, and the same reason, as
# the `location = /CMS.24.0.01/` block above — so this takes the one path we
# need without a PR to them.
#
# WHAT IT ADDS over theirs: a JSONP read (document mode 5 has no JSON, and a
# JSONP body is evaluated rather than parsed) and a ?set= NAVIGATION that writes
# the cookie in BOTH browser engines. A fetch PUT cannot reach the IE-mode jar:
# the engine is chosen by X-InternetExplorerMode on a top-level document load,
# so the preview app writing from Edge has always left the jar the legacy
# clients read empty. GET and PUT are otherwise a faithful copy of theirs.
#
# ONLY `preview`. settings, auth-hint and dismissed-notifications keep going to
# Polaris's regex — nothing in the IE-mode estate reads them.
#
# REMOVING THIS BLOCK hands the route straight back, with the cookie already in
# place and no migration either way.
#
# NO IE COERCION HERE. Unlike every other location in this file, this one must
# answer in whichever engine asks: Edge for the preview app's own GET and PUT,
# IE mode for the legacy clients' JSONP read. The ?set= handler does its own
# flipping, one jar per pass.
#
# $cors_origin and @gloco_preflight are defined in main's conf, in the same
# server block, so they resolve here — the same kind of dependency this file
# already has on $ieaction, cmsenv and the cmsproxy zone.
# ============================================================================
location = /global-components/state/preview {
    error_page 418 = @gloco_preflight;
    if ($request_method = OPTIONS) {
      return 418;
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;

    js_content glocoCmsAugmentation.handleStatePreview;
}
