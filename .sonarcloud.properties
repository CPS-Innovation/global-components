# SonarCloud analysis settings.
#
# Read by Automatic Analysis (there is no Sonar step in any workflow). Every entry
# below is a place where Sonar's default assumptions are wrong for this repo, and
# each says why. Nothing here is here to make a number look better.

# ---------------------------------------------------------------------------
# 0. The one exclusion, and why it is an exclusion rather than a rule ignore.
#
# Automatic Analysis honours only a subset of analysis properties, and exclusions
# are reliably in it; rule-level ignores below are best-effort. test-harness.js is
# the file that fails the Security Rating (see 1), so it uses the mechanism we can
# depend on. It is test infrastructure — never bundled, never deployed — and its
# suites still run on every build via the package's test.sh.
sonar.exclusions=**/cps-global-presence/test-harness.js,infra/proxy/config/**/previous/**,infra/proxy/config/main/global-components.js

sonar.issue.ignore.multicriteria=harness,es3includes,es3startswith,es3remove,es3hasown,es3number,es3optionalchain,es3var,es3spread,harnesstests,njsoptionalchain,njsreplaceall,njsstringraw

# ---------------------------------------------------------------------------
# 1. The presence-client test harness executes code, because that is its job.
#
# packages/cps-global-presence/ holds plain concatenated scripts that share
# one scope and have no module system — they cannot, because CMS Classic runs them
# at document mode 5. test-harness.js rebuilds that scope exactly as build.sh does,
# with `new Function`, so the tests exercise the real composition rather than a
# stand-in. It reads only files from this repository and is never bundled or
# deployed.
#
# It is flagged as production code purely because its NAME does not match a test
# convention, which is a modelling error rather than a finding. The alternatives
# are worse: vm.runInNewContext is very likely caught by the same rule, and writing
# the bundle to a temp file to require() it changes the shared-scope semantics the
# harness exists to reproduce.
sonar.issue.ignore.multicriteria.harness.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.harness.resourceKey=**/cps-global-presence/test-harness.js

# ---------------------------------------------------------------------------
# 2. The document mode 5 floor.
#
# THIS ONE IS A SAFETY MEASURE, NOT TIDINESS. The injected CMS clients run in Edge
# IE mode: Classic at document mode 5 (old JScript), Modern/DCF at mode 11. The
# rules below all recommend APIs that DO NOT EXIST at that floor —
# String#startsWith, Array#includes, Object.hasOwn, childNode.remove(),
# Number.parseInt, optional chaining. Following any of them breaks CMS Classic in
# production, silently, for every user.
#
# That is not hypothetical: a trailing comma in an array literal (legal ES3, but an
# extra `undefined` element under JScript) took the client down on 2026-09-01.
#
# The floor is enforced mechanically by the package's check-syntax.js, which
# runs on every build over both the sources and the emitted bundles. These
# exclusions exist so that nobody "fixes the Sonar warnings" in good faith and
# breaks the estate.
sonar.issue.ignore.multicriteria.es3includes.ruleKey=javascript:S7765
sonar.issue.ignore.multicriteria.es3includes.resourceKey=packages/cps-global-presence/**/*.js
sonar.issue.ignore.multicriteria.es3startswith.ruleKey=javascript:S6557
sonar.issue.ignore.multicriteria.es3startswith.resourceKey=packages/cps-global-presence/**/*.js
sonar.issue.ignore.multicriteria.es3remove.ruleKey=javascript:S7762
sonar.issue.ignore.multicriteria.es3remove.resourceKey=packages/cps-global-presence/**/*.js
sonar.issue.ignore.multicriteria.es3hasown.ruleKey=javascript:S6653
sonar.issue.ignore.multicriteria.es3hasown.resourceKey=packages/cps-global-presence/**/*.js
sonar.issue.ignore.multicriteria.es3number.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.es3number.resourceKey=packages/cps-global-presence/**/*.js
sonar.issue.ignore.multicriteria.es3optionalchain.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.es3optionalchain.resourceKey=packages/cps-global-presence/**/*.js
# `let`/`const` do not exist at document mode 5, and check-syntax.js rejects them.
sonar.issue.ignore.multicriteria.es3var.ruleKey=javascript:S3504
sonar.issue.ignore.multicriteria.es3var.resourceKey=packages/cps-global-presence/**/*.js
# Nor does the spread operator, at either floor.
sonar.issue.ignore.multicriteria.es3spread.ruleKey=javascript:S6666
sonar.issue.ignore.multicriteria.es3spread.resourceKey=packages/cps-global-presence/**/*.js

# ---------------------------------------------------------------------------
# 3. "Add some tests to this file or delete it" on files that are entirely tests.
#
# The presence-client suites are hand-rolled (h.test(...) from test-harness.js)
# because the proxy package has no runner of its own and adding one for a handful
# of files would be more machinery than the thing it tests. Sonar recognises the
# *.test.js naming but not the framework, so it reports every suite as an empty
# one. They are run by the package's test.sh — 100+ assertions at last count.
sonar.issue.ignore.multicriteria.harnesstests.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.harnesstests.resourceKey=packages/cps-global-presence/**/*.test.js

# ---------------------------------------------------------------------------
# 4. Copy-paste detection skips tests (see section 6; Sonar takes one value per
# property, so the test exclusions live on this line).
sonar.cpd.exclusions=**/*.test.*,**/*.spec.*

# ---------------------------------------------------------------------------
# 5. Archived proxy code under infra/proxy/config/**/previous/ (in sonar.exclusions).
#
# These are superseded earlier versions kept purely as reference — e.g. the v1 CMS
# auth flow and the original spike that the cms-auth-presence module (now
# cms-augmentation, 2026-11-10) grew from. They are NOT built, NOT bundled
# (build.sh copies none of it) and NOT deployed, so nothing in them can reach a
# user. Analysing them only measures the active module against its own ancestors:
# when the module was renamed (cms-auth-v2 -> cms-auth-presence, 2026-09-30) the
# moved archive counted as new code and failed the gate on duplication with the
# live file it was the draft of. Fix the live code; leave the archive as history.

# ---------------------------------------------------------------------------
# 6. Test files are excluded from duplication detection (in sonar.cpd.exclusions).
#
# Repetition in tests is deliberate: each case spells out its own arrange/act/
# assert so it can be read, and fail, on its own. Pulling that into shared
# helpers to satisfy a line-matcher makes tests harder to follow without making
# anything safer. The duplication gate exists to catch copy-paste in code that
# ships, and tests never ship. They are still analysed for every other rule —
# this is a duplication-only exclusion, not sonar.exclusions.

# ---------------------------------------------------------------------------
# 7. infra/proxy/config/main/global-components.js is Polaris's file, mirrored
#    (in sonar.exclusions).
#
# It is a byte-for-byte copy of Polaris's
# features/global-components/global-components.js, kept identical so the two can
# be diffed. Polaris owns and deploys it; we do not edit it, so its findings are not
# ours to act on. Its tests still run (infra/proxy pnpm test).
#
# It is also the source of global-components.vnext's COPIED sections. vnext is the
# advance copy of our PR to that file (see its README): handleState,
# handleNavigateCms and their helpers are copied verbatim so the PR is a clean
# replacement. Analysing the mirror only measures that deliberate copy as
# duplication, which failed PR #1219's gate (5.4%, all of it this pair).
# vnext itself stays analysed — its OURS sections are our code.

# ---------------------------------------------------------------------------
# 8. The njs floor.
#
# THE SAME KIND OF SAFETY MEASURE AS 2. Our proxy modules
# (infra/proxy/config/**/*.js) run in nginx's njs, not Node. The unit tests run them
# in Node, which accepts syntax njs rejects, so a change can pass every unit test
# and still stop nginx from starting — the whole proxy down. It has happened:
# `catch {` (optional catch binding) did exactly that under njs 0.8.5 on 2026-11-10.
#
# The rules below recommend constructs we have NOT proved under the deployed njs:
# optional chaining, String#replaceAll, and String.raw. Until one is proved in the
# Docker layers (infra/proxy/run-tests.sh, which runs real nginx + njs), the older
# form stays. If a Docker run proves one, delete its ignore here. features.unit.test.js
# guards the one construct we have already tripped on.
sonar.issue.ignore.multicriteria.njsoptionalchain.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.njsoptionalchain.resourceKey=infra/proxy/config/**/*.js
sonar.issue.ignore.multicriteria.njsreplaceall.ruleKey=javascript:S7781
sonar.issue.ignore.multicriteria.njsreplaceall.resourceKey=infra/proxy/config/**/*.js
sonar.issue.ignore.multicriteria.njsstringraw.ruleKey=javascript:S7780
sonar.issue.ignore.multicriteria.njsstringraw.resourceKey=infra/proxy/config/**/*.js
